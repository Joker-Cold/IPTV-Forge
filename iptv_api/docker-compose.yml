services:
  iptv-api:
    image: guovern/iptv-api:latest
    container_name: iptv-api
    restart: unless-stopped
    tty: true
    stdin_open: true

    ports:
      - "80:8080"

    volumes:
      - ./config:/iptv-api/config
      - ./output:/iptv-api/output
      # hand-collected local sources live outside the fork, in ../live/sources
      - ../live/sources:/iptv-api/config/local

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      PUBLIC_SCHEME: "http"
      # Replace with your public domain or IP
      PUBLIC_DOMAIN: "127.0.0.1"
      PUBLIC_PORT: "80"
      NGINX_HTTP_PORT: "8080"
      CDN_URL: ""
      # NOTE: deliberately no HTTP_PROXY/HTTPS_PROXY/ALL_PROXY here.
      # Every aiohttp session in utils/speed.py is built with trust_env=True,
      # so a proxy set via environment leaks into the speed test: each probe
      # dies with ClientProxyConnectionError in ~10ms and every stream scores
      # 0.00 M/s. ffmpeg honours http_proxy too, which blanks out resolution.
      # The proxy needed for fetching subscription sources lives in
      # config/user_config.ini (http_proxy) instead — that one is read only by
      # utils/requests/tools.py, so stream tests stay direct.